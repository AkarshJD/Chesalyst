[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chesalyst"
version = "0.1.0"
description = "Classical chess engine with bitboard move generation and alpha-beta search"
authors = [
    {name = "Akarsh J D", email = "jdakarsh@gmail.com"}
]
requires-python = ">=3.10"

dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
